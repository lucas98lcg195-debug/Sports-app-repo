<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>NCAA Scores</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b1d33">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NCAA Scores">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="scoreboard">
  <header class="app-header">
    <div class="header-top">
      <h1>NCAA Scores</h1>
      <div class="header-icons">
        <a href="search.html" class="icon-btn" aria-label="Search teams">🔍</a>
        <a href="settings.html" class="icon-btn" aria-label="Settings">⚙️</a>
      </div>
    </div>
    <div class="date-nav">
      <button id="prev-day" aria-label="Previous day">&lsaquo;</button>
      <span id="date-label"></span>
      <button id="next-day" aria-label="Next day">&rsaquo;</button>
      <button id="today-btn">Today</button>
    </div>
  </header>
  <nav class="top-nav">
    <a href="index.html" class="active">Scores</a>
    <a href="rankings.html">Rankings</a>
    <a href="standings.html">Standings</a>
    <a href="news.html">News</a>
  </nav>
  <main>
    <section class="sport-section" id="my-teams-section" hidden>
      <div class="section-header">
        <h2>My Teams</h2>
      </div>
      <div id="my-teams-games" class="game-list"></div>
    </section>
    <section class="sport-section">
      <div class="section-header">
        <h2>Football</h2>
        <select id="football-conference" class="conference-select" aria-label="Football conference">
          <option value="">All Conferences</option>
          <option value="__top25__">Top 25</option>
        </select>
      </div>
      <div id="football-games" class="game-list">
        <p class="loading">Loading...</p>
      </div>
    </section>
    <section class="sport-section">
      <div class="section-header">
        <h2>Baseball</h2>
        <select id="baseball-conference" class="conference-select" aria-label="Baseball conference">
          <option value="">All Conferences</option>
          <option value="__top25__">Top 25</option>
        </select>
      </div>
      <div id="baseball-games" class="game-list">
        <p class="loading">Loading...</p>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
